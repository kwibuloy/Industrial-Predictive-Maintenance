[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm"
version = "0.1.0"
description = "Industrial predictive maintenance on AI4I 2020 with an FDR-constrained classifier"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: fits a real model; skipped by the Stop hook"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
